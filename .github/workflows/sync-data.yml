name: sync-data

# 每交易日 UTC 00:30（美股收盘后）同步股价/成交量/财报/CAPE 并提交，
# 使回测与展示层的数据可复现——clone 仓库即得完整数据。
on:
  schedule:
    - cron: "30 0 * * 2-6" # 周二到周六（UTC，对应美股收盘后）
  workflow_dispatch:
    inputs:
      earnings_only:
        description: "只补财报日历，跳过股价历史（本地/临时补数据用）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install yfinance pandas lxml
      - name: sync
        run: |
          if [ "${{ github.event.inputs.earnings_only }}" = "true" ]; then
            python scripts/sync-prices.py --earnings-only
          else
            python scripts/sync-prices.py
          fi
          python scripts/sync-valuation.py
      # CSV 只是传输格式：close+volume、财报日全部入库，运行时统一从 DB 读
      - name: import to postgres
        run: npm run import-csv
      - name: commit data
        run: |
          git config user.name "data-bot"
          git config user.email "mnigc@users.noreply.github.com"
          git add data/prices data/earnings data/valuation
          git diff --cached --quiet || git commit -m "data: sync prices + earnings + cape $(date -u +%F)"
          git push
