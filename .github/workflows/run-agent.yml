name: run-agent

# 让"永不停歇"这句话成立：执行器与回测由 CI 每天驱动，不依赖有人手动敲命令。
# 排在 sync-data（UTC 00:30 推价格）之后一小时，保证决策看到的是当日收盘价。
on:
  schedule:
    - cron: "30 1 * * 2-6" # 周二到周六 UTC，对应美股收盘后的次日凌晨
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # DATABASE_URL 必须填 Supabase 的 **Session pooler** 连接串（aws-0-<region>.pooler.supabase.com）。
      # 直连主机 db.<ref>.supabase.co 只有 AAAA 记录，而 runner 到那段 AWS IPv6 无路由，
      # 会崩在 connect ENETUNREACH；pooler 有 A 记录，走 IPv4 即可。
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 执行器跑一轮（paper）
        run: npm run agent

      - name: 重跑回测
        run: npm run backtest

      # 站点是构建期读库的静态产物，写库不会自己刷新页面；落一个时间戳文件并 push，
      # 由那次 push 触发 Cloudflare 重建。web/public/ 会被 Astro 原样拷进产物，
      # 所以 https://…/last-run.txt 就是线上数据的真实新鲜度凭据。
      - name: 记录运行时间并触发站点重建
        run: |
          mkdir -p web/public
          date -u +%Y-%m-%dT%H:%M:%SZ > web/public/last-run.txt
          git config user.name "agent-bot"
          git config user.email "mnigc@users.noreply.github.com"
          git add web/public/last-run.txt
          git diff --cached --quiet && { echo "无变化，跳过"; exit 0; }
          git commit -m "chore: agent run $(date -u +%F)"
          # 与 sync-data 的提交可能撞车，rebase 后再推
          git pull --rebase origin main
          git push origin HEAD:main
